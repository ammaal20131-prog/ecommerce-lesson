<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>مقدمة في التجارة الإلكترونية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a presenter stage between a slim top bar (lesson + class tools) and a bottom nav; colours follow the original decks (violet, lime-olive, slate grey) */
:root{
  --bg:#EFEDF6; --surface:#FFFFFF; --surface2:#F6F4FB; --ink:#1F1B36; --muted:#6B6688; --line:#DCD7EC;
  --violet:#5E52B4; --violet-ink:#FFFFFF; --violet-soft:#E6E2F8;
  --lime:#DCE38F; --lime-ink:#2D3108; --slate:#5D5C66;
  --good:#1F8A5B; --good-soft:#DCF3E7; --bad:#C2413B; --bad-soft:#FBE2E0;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14121D; --surface:#1F1C2C; --surface2:#272337; --ink:#EEEBF8; --muted:#A6A0C2; --line:#3A3550;
  --violet:#8F84EE; --violet-ink:#15122A; --violet-soft:#2F2A4C; --lime:#CFD67C; --lime-ink:#20230A; --slate:#A9A8B6;
  --good:#5FD39C; --good-soft:#173A2B; --bad:#F08A84; --bad-soft:#47201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121D; --surface:#1F1C2C; --surface2:#272337; --ink:#EEEBF8; --muted:#A6A0C2; --line:#3A3550;
  --violet:#8F84EE; --violet-ink:#15122A; --violet-soft:#2F2A4C; --lime:#CFD67C; --lime-ink:#20230A; --slate:#A9A8B6;
  --good:#5FD39C; --good-soft:#173A2B; --bad:#F08A84; --bad-soft:#47201E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;direction:rtl}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
img{max-width:100%}
.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.toprow{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0}
.mainnav{display:flex;gap:4px;flex:1;min-width:0}
.mainnav a{color:var(--muted);text-decoration:none;font-weight:700;padding:6px 12px;border-radius:10px;white-space:nowrap}
.mainnav a:hover{color:var(--ink);background:var(--surface2)}
.mainnav a.cur{color:var(--violet-ink);background:var(--violet)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 14px;font-size:.88rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.subnav button.cur{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.subnav button .ok{width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;display:inline-grid;place-items:center;font-size:.65rem}
.readbar{height:4px;background:transparent}
.readbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--violet))}
.totop{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:48px;height:48px;border-radius:16px;border:0;background:var(--violet);color:var(--violet-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(40,30,90,.3)}
.totop svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6}

/* website sections */
.site{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:22px}
.lhero{border-radius:32px;background:var(--violet);color:var(--violet-ink);padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;position:relative;overflow:hidden}
.lhero::before,.lhero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.lhero::before{width:320px;height:320px;border:44px solid rgba(255,255,255,.08);left:-120px;top:-140px}
.lhero::after{width:140px;height:140px;background:var(--lime);opacity:.9;left:30%;bottom:-90px}
.lhero>*{position:relative;z-index:1}
.lhero h1{font-size:clamp(1.9rem,4.4vw,3.3rem)}
.lhero .tag{display:inline-block;background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85rem;margin-bottom:12px}
.lhero .qt{margin-top:18px;background:rgba(255,255,255,.12);border-radius:18px;padding:14px 18px;font-weight:600;max-width:52ch}
.lhero .qt small{display:block;color:var(--lime);font-weight:800;margin-bottom:4px}
.lhero img{justify-self:center;max-height:260px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 14px 24px rgba(0,0,0,.25))}
@keyframes float{50%{transform:translateY(-10px)}}
.meter{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.meter .track{flex:1;min-width:140px;max-width:320px;height:12px;border-radius:12px;background:rgba(255,255,255,.18);overflow:hidden}
.meter .track i{display:block;height:100%;width:0;background:var(--lime);border-radius:12px;transition:width .5s}
.meter b{font-family:var(--display)}
.sechead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:clamp(16px,2.6vw,28px) clamp(18px,3vw,34px);border-radius:26px;background:var(--surface2);border:1px solid var(--line);scroll-margin-top:130px;margin-top:18px}
.sechead .num{width:56px;height:56px;border-radius:18px;background:var(--violet);color:var(--violet-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem}
.sechead h2{font-size:clamp(1.4rem,3vw,2.3rem);color:var(--violet)}
.sechead p{margin:2px 0 0;color:var(--muted);font-weight:600}
.sechead img{max-height:90px;max-width:150px;object-fit:contain}
.sechead.alt{background:var(--lime);border-color:transparent}
.sechead.alt h2{color:var(--lime-ink)}.sechead.alt p{color:var(--lime-ink);opacity:.8}
.sechead.alt .num{background:var(--lime-ink);color:var(--lime)}
.block{scroll-margin-top:130px;transition:box-shadow .25s,border-color .25s}
.block:hover{border-color:color-mix(in srgb,var(--violet) 40%,var(--line));box-shadow:0 14px 40px rgba(60,40,140,.08)}
.block.done{border-color:var(--good)}
.donebadge{position:absolute;top:16px;left:16px;background:var(--good);color:#fff;border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700;z-index:2}
.showans{align-self:flex-start}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px}
.home .quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.home .quick .tile{min-height:110px}
@media (max-width:860px){.lhero,.home .quick{grid-template-columns:1fr 1fr}.lhero{grid-template-columns:1fr}.lhero img{max-height:170px}.sechead{grid-template-columns:auto minmax(0,1fr)}.sechead img{display:none}.mainnav a{padding:6px 8px}}
@media (max-width:520px){.home .quick{grid-template-columns:1fr 1fr}.mainnav a[data-go=home]{display:none}}
/* certificate */
.namebar{display:flex;flex-direction:column;gap:8px;background:var(--lime);color:var(--lime-ink);border-radius:20px;padding:14px 18px}
.namebar input{background:var(--surface);font-size:1.05rem}
.namebar.ok{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--violet-soft);color:var(--ink)}
.namebar.ok b{color:var(--violet);font-family:var(--display)}
.certwrap{position:fixed;inset:0;z-index:41;overflow:auto;background:rgba(15,12,30,.72);display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cert{width:min(860px,100%);aspect-ratio:1.414;background:#5E52B4;border-radius:10px;padding:clamp(8px,1.6vw,18px);box-shadow:0 30px 80px rgba(0,0,0,.4);animation:enter .6s ease-out;flex:none}
.cert-in{height:100%;background:#fff;color:#1F1B36;border:clamp(3px,.6vw,6px) solid #DCE38F;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,.8vw,8px);padding:clamp(10px,3vw,30px);text-align:center;position:relative;overflow:hidden}
.cert-top{position:absolute;top:clamp(8px,2vw,18px);inset-inline:clamp(10px,3vw,28px);display:flex;justify-content:space-between;color:#6B6688;font-size:clamp(.55rem,1.4vw,.85rem);gap:8px}
.medal{width:clamp(40px,8vw,74px);aspect-ratio:1;border-radius:50%;background:#5E52B4;display:grid;place-items:center}
.medal svg{width:58%;height:58%;fill:#DCE38F;stroke:#DCE38F}
.cert-k{font-family:var(--display);font-weight:800;color:#5E52B4;font-size:clamp(1.3rem,4.6vw,2.8rem);line-height:1.2}
.cert-p{margin:0;font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.7}
.cert-name{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4.6vw,2.7rem);border-bottom:clamp(3px,.5vw,5px) solid #DCE38F;padding-inline:clamp(10px,3vw,30px);line-height:1.5}
.cert-badge{background:#DCE38F;color:#2D3108;border-radius:999px;padding:clamp(2px,.5vw,6px) clamp(10px,2vw,22px);font-weight:700;font-size:clamp(.65rem,1.7vw,1rem)}
.cert-foot{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:clamp(4px,1.5vw,14px);font-size:clamp(.55rem,1.3vw,.85rem);color:#6B6688}
.cert-foot>div{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,22px);min-width:25%}
.cert-foot .sig{display:block;width:100%;border-bottom:1px solid #6B6688}
.cert-foot .tname{font-family:var(--display);color:#5E52B4;font-size:clamp(.8rem,2.2vw,1.35rem);margin-top:calc(-1 * clamp(4px,1.4vw,16px))}
.cert-foot .stars{flex-direction:row;gap:4px}
.cert-foot .stars svg{width:clamp(14px,2.6vw,26px);height:clamp(14px,2.6vw,26px);fill:#A79FE0;stroke:none}
.cert-foot .stars svg:nth-child(2){fill:#5E52B4;transform:scale(1.25)}
.codetoast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:70;background:#1B1830;color:#E8E6F5;border-radius:14px;padding:10px 16px 10px 14px;font-family:var(--body);font-weight:600;font-size:1rem;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);transition:transform .35s cubic-bezier(.3,1.5,.5,1);border:1px solid #3A3550}
.codetoast.on{transform:translate(-50%,0)}
.codetoast .prompt{color:#7EE2A8;font-family:ui-monospace,Consolas,monospace;font-weight:800}
.codetoast.bad .prompt{color:#F4A35B}
.codetoast .dots{display:flex;gap:4px;margin-inline-end:4px}.codetoast .dots i{width:8px;height:8px;border-radius:50%;background:#F26B6B}.codetoast .dots i:nth-child(2){background:#F4C95B}.codetoast .dots i:nth-child(3){background:#7EE2A8}
.cert-code{background:#1F1B36;color:#7EE2A8;border-radius:8px;padding:clamp(2px,.5vw,6px) clamp(10px,2vw,20px);font-weight:600;font-size:clamp(.6rem,1.5vw,.95rem)}
/* adventure map */
.advmap{background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;gap:18px;overflow:hidden;position:relative;
  background-image:radial-gradient(var(--violet-soft) 1.5px,transparent 1.5px);background-size:22px 22px}
.maphead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.maphead>div:first-child{min-width:0;flex:1}
.starbox{display:flex;align-items:center;gap:6px;background:var(--lime);color:var(--lime-ink);border-radius:18px;padding:10px 16px;font-family:var(--display)}
.starbox svg{width:28px;height:28px;fill:currentColor}
.starbox b{font-size:1.8rem;line-height:1}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:20px}
.trail::before{content:"";position:absolute;top:30px;bottom:30px;left:50%;border-left:6px dotted var(--line);transform:translateX(-50%)}
.stop{position:relative;display:flex;align-items:center;gap:14px;transform:translateX(calc(var(--o) * clamp(30px,9vw,110px)));width:min(100%,360px);justify-content:center}
.stop .node{position:relative;z-index:1;flex:none;width:clamp(72px,9vw,92px);aspect-ratio:1;border-radius:50%;border:0;display:grid;place-items:center;
  background:var(--violet);color:var(--violet-ink);box-shadow:0 7px 0 color-mix(in srgb,var(--violet) 60%,#000);transition:transform .15s}
.stop .node:hover{transform:translateY(-3px)}
.stop .node:active{transform:translateY(4px);box-shadow:0 3px 0 color-mix(in srgb,var(--violet) 60%,#000)}
.stop .node svg{width:40%;height:40%;fill:none;stroke:currentColor;stroke-width:2}
.stop.done .node{background:var(--lime);color:var(--lime-ink);box-shadow:0 7px 0 color-mix(in srgb,var(--lime) 55%,#000)}
.stop.done .node svg{fill:currentColor}
.stop.lock .node{background:var(--surface2);color:var(--muted);box-shadow:0 7px 0 var(--line);border:2px solid var(--line)}
.stop.cur .node::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--violet);opacity:.5;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.25);opacity:0}}
.stop .lab{position:absolute;inset-inline-start:calc(50% + clamp(46px,5.5vw,58px));width:max-content;max-width:min(42vw,220px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;font-size:.95rem;line-height:1.5;z-index:2}
.stop .lab small{display:block;color:var(--violet);font-size:.75rem}
.stop.lock .lab{color:var(--muted)}
.stop .hero-av{position:absolute;inset-inline-end:calc(50% + clamp(44px,5.5vw,56px));width:clamp(56px,7vw,76px);animation:float 2.4s ease-in-out infinite;z-index:2}
.stop .bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-weight:700;font-size:.8rem;border-radius:10px;padding:2px 10px;white-space:nowrap;z-index:3}
.stop.chest .node{width:clamp(88px,11vw,112px);background:#E9A93B;color:#3B2405;box-shadow:0 7px 0 #A8701C}
.stop.chest.lock .node{background:var(--surface2);color:var(--muted);box-shadow:0 7px 0 var(--line)}
.shake{animation:shake .45s}
.station{display:flex;flex-direction:column;gap:22px}
.station.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(18px)}}
.station .sechead{margin-top:0}
.stbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stend{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--violet-soft);border:2px dashed var(--violet);border-radius:24px;padding:18px 22px}
.btn.big{font-size:1.1rem;padding:12px 22px;border-radius:16px}
.btn.big svg{fill:var(--lime)}
.subnav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.subnav button.lockd{opacity:.5}
.chestbig{width:120px;height:120px;border-radius:30px;background:#E9A93B;color:#3B2405;display:grid;place-items:center;animation:float 2.4s ease-in-out infinite}
.chestbig svg{width:64px;height:64px}
@media (max-width:640px){.trail{align-items:stretch}.trail::before{left:auto;right:36px;transform:none}.stop{transform:none;width:100%;justify-content:flex-start}.stop .node{width:72px}.stop .lab{position:static;max-width:none;flex:1;min-width:0;width:auto;font-size:.9rem}.stop .hero-av{display:none}.stop .bubble{left:36px}.stop.chest .node{width:80px}.lhero img{display:none}}
.brand b{font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand span{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:10px;background:var(--violet);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--violet-ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600}
.tbtn:hover{border-color:var(--violet)}
.tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.mini-timer{font-variant-numeric:tabular-nums;font-family:var(--display);background:var(--lime);color:var(--lime-ink);border-color:transparent}
.mini-timer.done{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* stage */
main{flex:1;display:flex;justify-content:center;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{width:100%;background:var(--surface);border-radius:28px;border:1px solid var(--line);position:relative;overflow:hidden;
  padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;gap:16px}
.stage>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--violet);letter-spacing:0}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--lime);display:inline-block;box-shadow:0 0 0 3px var(--violet-soft)}
.h2{font-size:clamp(1.4rem,2.6vw,2.2rem)}
.lead{font-size:clamp(1.05rem,1.6vw,1.35rem);color:var(--ink);max-width:62ch}
.muted{color:var(--muted)}

/* bottom nav */
.nav{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.navbtn{border:0;border-radius:14px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line)}
.navbtn.primary{background:var(--violet);color:var(--violet-ink);border-color:var(--violet)}
.navbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
.progress{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--violet));border-radius:8px;transition:width .3s}
.pinfo{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pinfo span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* reveal steps */
[data-s]{transition:opacity .35s,transform .35s}
[data-s].off{opacity:0;transform:translateY(10px);pointer-events:none}

/* home */
.home{max-width:1100px;width:100%;display:flex;flex-direction:column;gap:22px}
.hero{background:var(--violet);color:var(--violet-ink);border-radius:28px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero h1{font-size:clamp(1.8rem,4vw,3rem)}
.hero p{margin:.4em 0 0;opacity:.9;font-size:1.05rem}
.hero .tag{display:inline-block;background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85rem;margin-bottom:12px}
.hero img{justify-self:center;max-height:240px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.2))}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:right}
.lcard:hover{border-color:var(--violet)}
.lcard .num{font-family:var(--display);font-size:.9rem;color:var(--violet);font-weight:700}
.lcard h3{font-size:1.35rem}
.lcard ul{margin:0;padding:0 18px 0 0;color:var(--muted)}
.lcard .go{margin-top:auto;align-self:flex-start;background:var(--violet);color:var(--violet-ink);border-radius:12px;padding:8px 16px;font-weight:700;border:0}
.howto{display:flex;flex-wrap:wrap;gap:10px 22px;color:var(--muted);font-size:.92rem}
kbd{font-family:var(--body);background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:0 7px;font-size:.85rem}

/* components */
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.btn.v{background:var(--violet);color:var(--violet-ink);border-color:var(--violet)}
.btn.l{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.84rem;background:var(--surface2);border:1px solid var(--line)}
.chip b{color:var(--violet);font-weight:700}
.chip.mode{background:var(--lime);color:var(--lime-ink);border-color:transparent;font-weight:700}
.q{background:var(--violet-soft);border-radius:16px;padding:12px 18px;font-weight:600;font-size:clamp(1.02rem,1.5vw,1.25rem)}
.q b{color:var(--violet)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.answer{background:var(--lime);color:var(--lime-ink);border-radius:16px;padding:12px 18px;font-weight:600;font-size:clamp(1rem,1.5vw,1.2rem)}
.answer b{font-weight:800}

/* quote */
.quote{flex:1;display:grid;place-items:center;text-align:center;gap:16px}
.quote .mark{font-family:var(--display);font-size:5rem;line-height:.6;color:var(--lime)}
.quote p{font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.7rem);font-weight:700;max-width:26ch;margin:0;line-height:1.6}

/* divider */
.divider{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}
.divider h2{font-size:clamp(2rem,5vw,4rem);color:var(--violet)}
.divider .sub{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--muted);margin-top:8px;font-weight:600}
.divider img{max-height:300px}
.ring{width:clamp(110px,16vw,190px);aspect-ratio:1;border-radius:50%;border:clamp(16px,2.4vw,28px) solid var(--lime);display:grid;place-items:center;color:var(--violet);font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.6rem)}

/* rules */
.rules{display:grid;gap:12px;counter-reset:r}
.rule{display:flex;gap:14px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:clamp(1rem,1.6vw,1.25rem);font-weight:600}
.rule::before{counter-increment:r;content:counter(r);font-family:var(--display);width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--violet);color:var(--violet-ink)}
.rule.ok{border-color:var(--good);background:var(--good-soft)}
.sign{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* flip cards */
.flip{perspective:900px;border:0;background:none;padding:0;min-height:170px;text-align:center}
.flip .in{position:relative;width:100%;height:100%;min-height:inherit;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--line)}
.flip .f{background:var(--surface2)}
.flip .f img{max-height:120px;object-fit:contain;border-radius:12px}
.flip .b{background:var(--violet);color:var(--violet-ink);transform:rotateY(180deg);font-family:var(--display);font-weight:700;font-size:clamp(1rem,1.6vw,1.3rem)}
.flip .b small{font-family:var(--body);font-weight:500;font-size:.9rem;opacity:.92;line-height:1.6}
.flip .hint{font-size:.8rem;color:var(--muted)}
.flip.tall{min-height:240px}
.flip .f .ph{font-family:var(--display);font-size:3rem;color:var(--violet)}

/* word order */
.bank,.line{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;border-radius:16px;padding:10px;align-content:flex-start}
.bank{background:var(--surface2);border:1px dashed var(--line)}
.line{background:var(--violet-soft);border:2px dashed var(--violet)}
.line.good{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.line.bad{border-color:var(--bad);animation:shake .4s}
.w{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:700;font-size:clamp(.95rem,1.4vw,1.15rem)}
.w:hover{border-color:var(--violet)}
.line .w{background:var(--violet);color:var(--violet-ink);border-color:var(--violet)}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}

/* reveal tiles */
.tile{border:2px dashed var(--line);background:var(--surface2);border-radius:var(--r);padding:16px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:700;font-size:clamp(.98rem,1.4vw,1.15rem)}
.tile .ic{width:54px;height:54px;border-radius:16px;background:var(--violet-soft);display:grid;place-items:center}
.tile .ic svg{width:30px;height:30px;stroke:var(--violet);fill:none;stroke-width:1.8}
.tile .qm{font-family:var(--display);font-size:2.4rem;color:var(--muted)}
.tile.on{border-style:solid;border-color:var(--violet);background:var(--surface)}

/* sort / balance */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:16px;background:var(--surface2);border:1px dashed var(--line)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;text-align:right;font-size:clamp(.9rem,1.3vw,1.05rem);line-height:1.5;max-width:100%}
.card[draggable=true]{cursor:grab}
.card.sel{outline:3px solid var(--violet);outline-offset:1px}
.card.good{background:var(--good-soft);border-color:var(--good)}
.card.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}
.buckets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bucket{border:2px solid var(--line);border-radius:var(--r);padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:right}
.bucket h3{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bucket h3 .n{font-family:var(--display);background:var(--violet-soft);color:var(--violet);border-radius:10px;padding:0 10px;font-size:.95rem}
.bucket.ready{border-color:var(--violet);border-style:dashed}
.bucket.over{background:var(--violet-soft)}
.bucket.pro h3{color:var(--good)}.bucket.con h3{color:var(--bad)}
.score{font-family:var(--display);font-weight:700;color:var(--violet)}
.scale{position:relative;height:110px;max-width:560px;width:100%;margin:0 auto}
.scale .post{position:absolute;left:50%;bottom:0;width:10px;height:84px;background:var(--slate);border-radius:6px;transform:translateX(-50%)}
.scale .base{position:absolute;left:50%;bottom:0;width:120px;height:12px;background:var(--slate);border-radius:8px;transform:translateX(-50%)}
.scale .beam{position:absolute;left:8%;right:8%;top:18px;height:10px;background:var(--violet);border-radius:8px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.scale .pan{position:absolute;top:-6px;width:110px;transform:translateX(-50%);text-align:center;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.scale .pan .dish{height:30px;border-radius:0 0 60px 60px;border:3px solid var(--violet);border-top:0;margin-top:34px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--violet)}
.scale .pan .rope{position:absolute;top:0;left:50%;width:2px;height:36px;background:var(--violet);transform:translateX(-50%)}
.scale .pan.r{left:92%}.scale .pan.l{left:8%}
.scale .lbl{position:absolute;top:70px;font-weight:800;font-size:.95rem}
.scale .lbl.r{right:0;color:var(--good)}.scale .lbl.l{left:0;color:var(--bad)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 12px;font:inherit;color:var(--ink)}

/* pros/cons */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px 14px;align-items:stretch}
.vs .hd{font-family:var(--display);font-weight:800;font-size:1.25rem;border-radius:14px;padding:6px 14px;text-align:center}
.vs .hd.p{background:var(--good-soft);color:var(--good)}.vs .hd.c{background:var(--bad-soft);color:var(--bad)}
.vs .it{border-radius:14px;padding:10px 14px;border:1px solid var(--line);background:var(--surface2);font-size:clamp(.92rem,1.3vw,1.08rem);font-weight:500}
.vs .it.p{border-inline-start:5px solid var(--good)}.vs .it.c{border-inline-start:5px solid var(--bad)}
.vs .mid{display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--violet)}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:8px 16px;font-weight:700}
.tab[aria-selected=true]{background:var(--violet);color:var(--violet-ink);border-color:var(--violet)}
.panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center}
.panel img{max-height:280px;justify-self:center;border-radius:16px}
.panel ul{margin:.3em 0;padding-right:20px}
.panel li{margin:.25em 0}
.code{font-family:var(--display);font-weight:800;color:var(--violet);direction:ltr;unicode-bidi:isolate}

/* video */
.vid{width:100%;aspect-ratio:16/9;max-height:62vh;border-radius:18px;background:#000;display:block}

/* quiz */
.qz{display:flex;flex-direction:column;gap:12px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:600;text-align:right;font-size:clamp(.95rem,1.4vw,1.12rem)}
.opt:hover{border-color:var(--violet)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.g{background:var(--good)}.dots i.b{background:var(--bad)}.dots i.c{outline:2px solid var(--violet);outline-offset:2px}
.fb{min-height:1.7em;font-weight:600}
.fb.g{color:var(--good)}.fb.b{color:var(--bad)}

/* KWL */
.kwl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kwl label{font-family:var(--display);font-weight:700;display:block;margin-bottom:6px}
.kwl label small{display:block;font-family:var(--body);color:var(--muted);font-weight:500;font-size:.8rem}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink);line-height:1.7}
.kwl .k{background:var(--violet);color:var(--violet-ink);border-radius:12px;padding:4px 12px}
.kwl .w2{background:var(--lime);color:var(--lime-ink);border-radius:12px;padding:4px 12px}
.kwl .l2{background:var(--slate);color:var(--surface);border-radius:12px;padding:4px 12px}

/* flow / sim */
.flow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;counter-reset:f}
.fstep{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;position:relative}
.fstep::before{counter-increment:f;content:counter(f);width:34px;height:34px;border-radius:50%;background:var(--violet);color:var(--violet-ink);display:grid;place-items:center;font-family:var(--display)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:st}
.stp{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:9px 12px;text-align:right;display:flex;gap:10px;align-items:center;font-weight:600;font-size:clamp(.92rem,1.3vw,1.05rem)}
.stp::before{counter-increment:st;content:counter(st);flex:none;width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display)}
.stp[aria-current=true]{border-color:var(--violet);background:var(--violet-soft)}
.stp[aria-current=true]::before{background:var(--violet);color:var(--violet-ink);border-color:var(--violet)}
.shot{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.shot img{border-radius:12px;max-height:46vh;object-fit:contain;background:#fff}
.shot .cap{font-weight:700;font-size:clamp(1rem,1.5vw,1.2rem);text-align:center}

/* order game */
.olist{display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:8px 10px;font-weight:600}
.oitem .t{flex:1;min-width:0}
.oitem .mv{display:flex;gap:4px}
.oitem .mv button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.oitem .mv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}
.oitem.good{border-color:var(--good);background:var(--good-soft)}
.oitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.oitem .no{font-family:var(--display);color:var(--violet);width:26px;text-align:center}

/* closing */
.close3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1}
.close3 .box{display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center}
.close3 h3{color:var(--violet);font-size:1.5rem}
.close3 p{margin:0;font-size:clamp(1rem,1.5vw,1.2rem);font-weight:600}

/* side drawer + tools */
.scrim{position:fixed;inset:0;background:rgba(15,12,30,.45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(420px,92vw);background:var(--surface);z-index:41;display:flex;flex-direction:column;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:16px;gap:12px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer header{display:flex;justify-content:space-between;align-items:center}
.drawer .body{overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding-inline-end:4px}
.toc a{display:flex;gap:10px;padding:7px 10px;border-radius:10px;color:inherit;text-decoration:none;font-size:.95rem}
.toc a:hover{background:var(--surface2)}
.toc a.cur{background:var(--violet-soft);font-weight:700}
.toc a span{color:var(--muted);font-variant-numeric:tabular-nums;width:24px;flex:none}
.timer-big{font-family:var(--display);font-size:4rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--violet);line-height:1.2}
.picked{font-family:var(--display);font-size:2rem;text-align:center;min-height:3rem;color:var(--violet)}
.groups{display:flex;flex-direction:column;gap:8px}
.grp{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.grp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink)}
.grp .pts{font-family:var(--display);font-size:1.3rem;width:40px;text-align:center;font-variant-numeric:tabular-nums}
.grp button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.close-x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:10px;font-size:1.2rem}
.ttabs{display:flex;gap:6px}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:60}

@media (max-width:860px){
  .hero,.lessons,.panel,.sim,.divider{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kwl,.close3,.buckets{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr 1fr}
  .divider img,.divider .ring{display:none}
  .brand span{display:none}
  .tbtn .lbl{display:none}
}
@media (max-width:520px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .vs{grid-template-columns:1fr}.vs .mid{display:none}
  .navbtn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(()=>{
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function meta(m,mode){
 if(!m&&!mode) return "";
 let h='<div class="meta">';
 if(mode) h+=`<span class="chip mode">${esc(mode)}</span>`;
 if(m){h+=`<span class="chip"><b>الاستراتيجية</b> ${esc(m.s)}</span><span class="chip"><b>المهارة</b> ${esc(m.sk)}</span><span class="chip"><b>النوع</b> ${esc(m.t)}</span>`;
   h+=`<button class="btn l" data-timer="${m.m}">${ic("timer")} ابدئي المؤقت · ${ar(m.m)} ${m.m>2?"دقائق":m.m==2?"دقيقتان":"دقيقة"}</button>`;}
 return h+"</div>";
}
function head(s){return `<div><div class="eyebrow"><i></i>${esc(s.label||s.sec)}</div>${s.title?`<h2 class="h2" style="margin-top:6px">${esc(s.title)}</h2>`:""}</div>${meta(s.meta,s.mode)}`}
function linkBtn(l){return l?`<a class="btn" href="${esc(l.href)}" target="_blank" rel="noopener">${ic("link")} ${esc(l.t)}</a>`:""}

wordorder(s,el){
 el.innerHTML=`${head(s)}<div class="q">${s.q}</div><div class="line" aria-label="التعريف"></div><div class="bank"></div>
 <div class="row"><button class="btn v" data-a="check">${ic("check")} تحقّقي</button><button class="btn" data-a="reset">${ic("redo")} من جديد</button><button class="btn" data-a="show">${ic("eye")} إظهار التعريف</button><span class="fb"></span></div><div class="answer" data-s="1">${s.def}</div>`;
 const bank=$(".bank",el),line=$(".line",el),fb=$(".fb",el);
 const build=()=>{bank.innerHTML="";line.innerHTML="";line.className="line";fb.textContent="";shuffle(s.words).forEach(w=>{const b=document.createElement("button");b.className="w";b.textContent=w;b.onclick=()=>{(b.parentNode===bank?line:bank).appendChild(b);line.classList.remove("good","bad")};bank.appendChild(b)})};
 build();
 el.querySelector('[data-a=reset]').onclick=build;
 el.querySelector('[data-a=check]').onclick=()=>{const got=$$(".w",line).map(b=>b.textContent).join(" ");
  if(got===s.words.join(" ")){line.className="line good";fb.className="fb g";fb.textContent="أحسنتِ! ترتيب صحيح.";burst();reveal(el);done(el)}
  else{line.className="line";void line.offsetWidth;line.classList.add("bad");fb.className="fb b";fb.textContent=bank.children.length?"أكملي ترتيب جميع الكلمات.":pick(BUGS)}};
 el.querySelector('[data-a=show]').onclick=()=>reveal(el);
 return 1;
},

 $('[data-a=all]',el).onclick=()=>$$(".tile",el).forEach(open);
},

 const w=beam.offsetWidth/2||200,dy=Math.sin(a*Math.PI/180)*w;$(".pan.r",el).style.transform=`translate(-50%,${dy}px)`;$(".pan.l",el).style.transform=`translate(-50%,${-dy}px)`;
 $(".pan.r .dish",el).textContent=ar(p);$(".pan.l .dish",el).textContent=ar(c)}

/* ---------- website ---------- */
let secs=[];
const AUTO=new Set(["rules","wordorder","tiles","sort","quiz","tf","order"]);
const STANDALONE=new Set(["البداية","أهداف الدرس","قيمة وطنية","إثراء","قيمة دينية","نشاط ختامي","الختام"]);
const SECTITLE={"البداية":"قبل أن نبدأ","نشاط ختامي":"نشاط ختامي (إغلاق الدرس)","إثراء":"إثراء (أضيفي إلى معلوماتي)"};
function reveal(el){$$(".answer",el).forEach(a=>a.hidden=false);$$(".showans",el).forEach(b=>b.remove())}
function mark(el){if(!el||!el.dataset.act||el.classList.contains("done"))return;el.classList.add("done");el.insertAdjacentHTML("beforeend",'<span class="donebadge">✓ تم النشاط</span>');$$(".finish",el).forEach(b=>b.remove());
 const d=store.get("done-"+cur,[]);if(!d.includes(el.id)){d.push(el.id);store.set("done-"+cur,d)}updMeter()}
function done(el){mark(el)}
function updMeter(){const all=$$(".block[data-act]",main),d=all.filter(b=>b.classList.contains("done")).length;const m=$("#meterFill");
 if(m){m.style.width=(all.length?d/all.length*100:0)+"%";$("#meterTxt").textContent=`إنجاز الفصل: ${ar(d)} من ${ar(all.length)} أنشطة`}
 secs.forEach(s=>{const bl=all.filter(b=>b.dataset.sec===s.id);const ch=$(`#subnav [data-to="${s.id}"]`);if(ch&&bl.length&&bl.every(b=>b.classList.contains("done"))&&!$(".ok",ch))ch.insertAdjacentHTML("afterbegin",'<span class="ok">✓</span>')})}
function renderLesson(k){
 const L=LESSONS[k];secs=[];
 const title=L.slides.find(s=>s.k==="title"),quote=L.slides.find(s=>s.k==="quote");
 main.innerHTML=`<div class="site"><section class="lhero"><div><span class="tag">${esc(title.unit)} · ${esc(title.lesson)}</span><h1>${esc(title.part)}</h1><div class="qt"><small>إضاءة</small>${esc(quote.text)}</div><div class="meter"><div class="track"><i id="meterFill"></i></div><b id="meterTxt"></b></div></div><img src="img/${k==="l1"?"shop":"cart"}.webp" alt=""></section></div>`;
 const site=$(".site",main);let last=null,secId="";
 const addHead=(t,sub,img,ring)=>{const id="s"+(secs.length+1);secs.push({id,t});secId=id;const alt=/نشاط|مراجعة/.test(t);
  site.insertAdjacentHTML("beforeend",`<header class="sechead${alt?" alt":""}" id="${id}"><div class="num">${ar(secs.length)}</div><div><h2>${esc(t)}</h2>${sub?`<p>${esc(sub)}</p>`:""}</div>${img?`<img src="img/${img}.webp" alt="">`:""}</header>`)};
 L.slides.forEach((s,i)=>{
  if(s.k==="quote"||s.k==="title")return;
  if(s.k==="divider"){addHead(s.title,s.sub,s.img);last=s.sec;return}

function startTimer(sec){tTotal=tLeft=sec;tRun=true;clearInterval(tInt);tInt=setInterval(tick,1000);updTimer()}
$("#miniTimer").onclick=()=>openTool("timer");
let actx;function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}}

function openTool(t){
 if(t==="timer"){
  const d=drawer("المؤقت",`<div class="timer-big">${ar(fmt(tLeft))}</div><div class="row" style="justify-content:center">${[1,2,3,5,10].map(m=>`<button class="btn" data-m="${m}">${ar(m)} د</button>`).join("")}</div><div class="row" style="justify-content:center"><button class="btn v" id="tStart">${tRun?"إيقاف مؤقت":"تشغيل"}</button><button class="btn" id="tReset">إعادة</button><button class="btn" id="tHide">إخفاء المؤقت</button></div><p class="muted" style="text-align:center;margin:0">يظهر المؤقت أعلى الشاشة أثناء العمل، ويصدر تنبيهًا صوتيًا عند انتهاء الوقت.</p>`);
  $$("[data-m]",d).forEach(b=>b.onclick=()=>startTimer(+b.dataset.m*60));
  $("#tStart",d).onclick=()=>{if(tRun){tRun=false;clearInterval(tInt)}else if(tLeft>0){tRun=true;clearInterval(tInt);tInt=setInterval(tick,1000)}updTimer()};
  $("#tReset",d).onclick=()=>{tRun=false;clearInterval(tInt);tLeft=tTotal;updTimer()};
  $("#tHide",d).onclick=()=>{tRun=false;clearInterval(tInt);tLeft=0;tTotal=0;updTimer();closeLayer()};
 }
 if(t==="pick"){
  const names=store.get("names","");
  const d=drawer("اختيار طالبة عشوائيًا",`<div class="picked" id="picked">؟</div><button class="btn v" id="pickBtn" style="justify-content:center">اختاري طالبة</button><label class="muted" for="namesTa">أسماء الطالبات (اسم في كل سطر) — تُحفظ على هذا الجهاز:</label><textarea id="namesTa" placeholder="نورة&#10;ريم&#10;سارة…">${esc(names)}</textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="noRepeat" checked> عدم تكرار الاسم حتى يُختار الجميع</label>`);
  const ta=$("#namesTa",d);ta.oninput=()=>store.set("names",ta.value);
  let used=store.get("used",[]);
  $("#pickBtn",d).onclick=()=>{let list=ta.value.split("\n").map(x=>x.trim()).filter(Boolean);if(!list.length){$("#picked",d).textContent="أضيفي الأسماء أولًا";return}
   let pool=$("#noRepeat",d).checked?list.filter(n=>!used.includes(n)):list;if(!pool.length){used=[];pool=list}
   let n=0;const out=$("#picked",d);const final=pool[Math.floor(Math.random()*pool.length)];
   const spin=setInterval(()=>{out.textContent=list[Math.floor(Math.random()*list.length)];if(++n>14){clearInterval(spin);out.textContent=final;used.push(final);store.set("used",used);burst()}},70)};
 }
 if(t==="groups"){
  let g=store.get("groups",[{n:"المجموعة الأولى",p:0},{n:"المجموعة الثانية",p:0},{n:"المجموعة الثالثة",p:0},{n:"المجموعة الرابعة",p:0}]);
  const d=drawer("نقاط المجموعات",`<div class="groups"></div><div class="row"><button class="btn" id="gAdd">إضافة مجموعة</button><button class="btn" id="gZero">تصفير النقاط</button></div>`);
  const draw=()=>{const box=$(".groups",d);const max=Math.max(...g.map(x=>x.p));box.innerHTML=g.map((x,i)=>`<div class="grp"${x.p===max&&max>0?' style="border-color:var(--violet)"':""}><input value="${esc(x.n)}" data-i="${i}" aria-label="اسم المجموعة"><button data-m="${i}">−</button><span class="pts">${ar(x.p)}</span><button data-p="${i}">+</button></div>`).join("");
   $$("input",box).forEach(n=>n.oninput=()=>{g[+n.dataset.i].n=n.value;store.set("groups",g)});
   $$("[data-p]",box).forEach(b=>b.onclick=()=>{g[+b.dataset.p].p++;store.set("groups",g);draw()});
   $$("[data-m]",box).forEach(b=>b.onclick=()=>{g[+b.dataset.m].p=Math.max(0,g[+b.dataset.m].p-1);store.set("groups",g);draw()})};
  $("#gAdd",d).onclick=()=>{g.push({n:"مجموعة "+ar(g.length+1),p:0});store.set("groups",g);draw()};
  $("#gZero",d).onclick=()=>{g.forEach(x=>x.p=0);store.set("groups",g);draw()};draw();
 }
}
function toggleFs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
$("#fsBtn").onclick=toggleFs;

const BUGS=["Bug صغير! أعيدي التشغيل وحاولي مرة أخرى","خطأ بسيط في السطر… راجعيه وجرّبي","كل مبرمجة تمر بالأخطاء، حاولي مرة أخرى","Error 404: الإجابة الصحيحة في مكان آخر، جرّبي"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let toastT;
function cheer(msg,bad){let t=$("#codeToast");if(!t){t=document.createElement("div");t.id="codeToast";t.setAttribute("role","status");document.body.appendChild(t)}
 t.className="codetoast"+(bad?" bad":"");t.innerHTML=`<span class="dots"><i></i><i></i><i></i></span><span class="prompt">&gt;</span> <span class="msg"></span>`;$(".msg",t).textContent=msg||pick(CHEERS);
 void t.offsetWidth;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200)}

/* confetti */
function burst(){
 cheer();
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=document.createElement("canvas");c.className="fx";document.body.appendChild(c);const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue("--violet"),cs.getPropertyValue("--lime"),"#F2A541","#4FC3A1"];
 const P=Array.from({length:90},()=>({x:c.width/2,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
 let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<80)requestAnimationFrame(loop);else c.remove()})();
}

/* boot */
function fromHash(){const h=(location.hash||"").slice(1),m=h.match(/^(l[12])(?:-\d+)?$/);const want=m?m[1]:null;
 if(want!==cur||!main.children.length)go(want)}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
